<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" preserveAspectRatio="xMidYMax slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#05080f"/>
      <stop offset="0.55" stop-color="#0a1526"/>
      <stop offset="1" stop-color="#0c1c33"/>
    </linearGradient>
    <radialGradient id="moonGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#9fe6ff" stop-opacity="0.55"/>
      <stop offset="0.3" stop-color="#35a2ff" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#35a2ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="horizon" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#35a2ff" stop-opacity="0.30"/>
      <stop offset="0.5" stop-color="#35a2ff" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#35a2ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="underGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#9fe6ff" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#35a2ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#9fe6ff" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#9fe6ff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#070b12" stop-opacity="0"/>
      <stop offset="1" stop-color="#070b12"/>
    </linearGradient>
    <filter id="blur6" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
    <filter id="blur4" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
    <pattern id="win" width="12" height="16" patternUnits="userSpaceOnUse">
      <rect x="3" y="4" width="3" height="5" fill="#35a2ff" opacity="0.25"/>
    </pattern>
    <pattern id="winFaint" width="16" height="20" patternUnits="userSpaceOnUse">
      <rect x="4" y="5" width="3" height="5" fill="#35a2ff" opacity="0.12"/>
    </pattern>
  </defs>

  <style>
    .wb { animation: wbk 4.2s infinite; }
    .wb2 { animation: wbk 5.6s 1.1s infinite; }
    .wb3 { animation: wbk 6.8s 2.3s infinite; }
    .atw { animation: atk 2.4s infinite; }
    .atw2 { animation: atk 2.9s 0.6s infinite; }
    .atw3 { animation: atk 3.4s 1.3s infinite; }
    .s1 { animation: smoke 7s 0s infinite; }
    .s2 { animation: smoke 9s 2.5s infinite; }
    .s3 { animation: smoke 8s 4.5s infinite; }
    .neon { animation: neonk 5s infinite; }
    .pulse { animation: glowk 3s ease-in-out infinite; }
    @keyframes wbk { 0%, 100% { opacity: 0.9; } 50% { opacity: 0.1; } }
    @keyframes atk { 0%, 100% { opacity: 0.95; } 50% { opacity: 0.15; } }
    @keyframes smoke { 0% { transform: translateY(0) scale(0.6); opacity: 0.35; } 100% { transform: translateY(-80px) scale(1.6); opacity: 0; } }
    @keyframes neonk { 0%, 90%, 100% { opacity: 1; } 91% { opacity: 0.35; } 92% { opacity: 1; } 95% { opacity: 0.55; } 96% { opacity: 1; } }
    @keyframes glowk { 0%, 100% { opacity: 0.5; } 50% { opacity: 0.85; } }
  </style>

